name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]" pystray
      - name: Headless self-check
        run: hermes-companion --seed 42 selfcheck
      # Tests that inspect a locally installed Hermes agent are skipped in CI.
      - name: Tests
        run: >
          pytest -q
          --deselect hermes_companion/tests/test_plugin_loader.py
          --deselect hermes_companion/tests/test_plugin_bundle_shadowing.py::BundleFreshnessTest::test_the_actually_installed_bundle_is_current
      # Prove a fresh PC can actually run it: the real launcher installs into
      # .venv, forwards options, opens the desktop window, and exits cleanly.
      - name: Doctor
        run: hermes-companion doctor
      - name: Visibility probe (is the companion really on screen?)
        run: python -m hermes_companion.scripts.visibility_probe
      - name: Desktop icon
        shell: pwsh
        run: |
          $out = hermes-companion shortcut 2>&1 | Out-String
          Write-Output $out
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Hermes Companion.lnk'
          if (-not (Test-Path $lnk)) { Write-Error "no desktop icon at $lnk"; exit 1 }
          $l = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Output "$($l.TargetPath) $($l.Arguments) icon=$($l.IconLocation)"
          if ($l.Arguments -notmatch 'hermes_companion home') { Write-Error "icon does not open Home"; exit 1 }
          if (-not (Test-Path ($l.IconLocation -replace ',\d+$',''))) { Write-Error "icon image missing"; exit 1 }
      - name: Launcher smoke test (real window)
        shell: pwsh
        run: |
          $out = cmd /c "echo.| Start-Companion.cmd --palette fire --size large --seconds 6" 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "PLAY OK") { Write-Error "Start-Companion.cmd did not run"; exit 1 }
          $out2 = cmd /c "hermes-companion.cmd play --companion nia --palette indigo --sound --seconds 6" 2>&1 | Out-String
          Write-Output $out2
          if ($out2 -notmatch "PLAY OK") { Write-Error "hermes-companion.cmd did not run"; exit 1 }
          $out4 = cmd /c "hermes-companion.cmd play --with nia,herald --seconds 5" 2>&1 | Out-String
          Write-Output $out4
          if (([regex]::Matches($out4, "PLAY READY")).Count -lt 3) { Write-Error "companions on screen did not all start"; exit 1 }
          $out3 = cmd /c "echo.| Start-Companion.cmd herald --seconds 3" 2>&1 | Out-String
          Write-Output $out3
          if ($out3 -notmatch "PLAY OK") { Write-Error "named companion did not run"; exit 1 }

  linux-window:
    # macOS/Linux fallback: the companion must run in a normal window.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: pip install -e .
      - name: Windowed smoke test
        run: |
          out=$(xvfb-run -a hermes-companion play --seconds 3 --high-contrast --reduced-motion 2>&1)
          echo "$out"
          echo "$out" | grep -q "PLAY OK" && echo "$out" | grep -q "render=windowed"
      - name: Live end-to-end (real Hermes plugin hooks -> live Nyamekra)
        run: xvfb-run -a python -m hermes_companion.scripts.live_e2e nyamekra
      - name: Live end-to-end (real Hermes plugin hooks -> live Masque)
        run: xvfb-run -a python -m hermes_companion.scripts.live_e2e masque
