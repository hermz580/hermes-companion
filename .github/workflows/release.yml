name: Release

# Builds HermesCompanion.exe (no Python needed), proves it starts on a real
# Windows desktop, and attaches it to a GitHub release for version tags.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A regular (not editable) install, plus --paths ., so PyInstaller can
      # find and bundle the hermes_companion package itself.
      - run: pip install . pyinstaller
      - run: python packaging/make_icon.py
      - name: Confirm the package imports from the build environment
        run: python -c "import hermes_companion.cli.emit, hermes_companion.renderer.tray; print('ok')"
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name HermesCompanion
          --icon packaging/icon.ico
          --paths .
          --collect-submodules hermes_companion
          --hidden-import pystray._win32
          packaging/launcher.py
      - name: Smoke test the exe (real window, must exit cleanly)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\HermesCompanion.exe -ArgumentList "play","--seconds","6","--no-memory" -PassThru
          $log = Join-Path $env:LOCALAPPDATA "hermes-companion\last-run.log"
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Get-Content $log -ErrorAction SilentlyContinue; Write-Error "exe did not finish"; exit 1 }
          Get-Content $log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "exe exit code $($p.ExitCode)"; exit 1 }
          $d = Start-Process -FilePath dist\HermesCompanion.exe -ArgumentList "doctor","--no-window" -PassThru
          if (-not $d.WaitForExit(60000)) { $d.Kill(); Write-Error "doctor hung"; exit 1 }
          if ($d.ExitCode -ne 0) { Write-Error "doctor reported problems"; exit 1 }
          Get-Item dist\HermesCompanion.exe | Format-List Name, Length
      - name: Install test (exe copies itself, Desktop + Start menu icons)
        shell: pwsh
        run: |
          $i = Start-Process -FilePath dist\HermesCompanion.exe -ArgumentList "install" -PassThru
          if (-not $i.WaitForExit(60000)) { $i.Kill(); Write-Error "install hung"; exit 1 }
          Get-Content (Join-Path $env:LOCALAPPDATA "hermes-companion\last-run.log") -ErrorAction SilentlyContinue
          if ($i.ExitCode -ne 0) { Write-Error "install exit code $($i.ExitCode)"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Hermes Companion\HermesCompanion.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe not copied to $exe"; exit 1 }
          $sh = New-Object -ComObject WScript.Shell
          foreach ($f in "Desktop", "Programs") {
            $lnk = Join-Path ([Environment]::GetFolderPath($f)) "Hermes Companion.lnk"
            if (-not (Test-Path $lnk)) { Write-Error "missing $lnk"; exit 1 }
            $l = $sh.CreateShortcut($lnk)
            if ($l.TargetPath -ne $exe -or $l.Arguments -ne "home") { Write-Error "bad shortcut $lnk"; exit 1 }
            Write-Output "ok $lnk -> $($l.TargetPath) $($l.Arguments)"
          }
          $u = Start-Process -FilePath $exe -ArgumentList "install","--uninstall" -PassThru
          if (-not $u.WaitForExit(60000)) { $u.Kill(); Write-Error "uninstall hung"; exit 1 }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "Hermes Companion.lnk")) {
            Write-Error "uninstall left the Desktop icon"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: HermesCompanion-exe
          path: dist/HermesCompanion.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HermesCompanion.exe
          generate_release_notes: true
      - name: Publish release from a manual run
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hermes Companion ${{ inputs.tag }}
          files: dist/HermesCompanion.exe
          generate_release_notes: true
